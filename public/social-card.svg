    <text x="310" y="442" text-anchor="middle" fill="#89eaf3">Python</text>
    <rect x="382" y="414" width="98" height="42" rx="11" fill="#102f41" stroke="#258aa0"/>
    <text x="431" y="442" text-anchor="middle" fill="#89eaf3">Java</text>
  </g>
  <path d="M 813 214 Q 813 190 839 190 L 1033 190 Q 1059 190 1059 214 L 1081 353 Q 1087 389 1055 397 Q 1035 403 1019 383 L 984 343 L 888 343 L 853 383 Q 837 403 817 397 Q 785 389 791 353 Z" fill="#0b2b42" stroke="#1bd0e6" stroke-width="8"/>
